name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.21.0'

jobs:
  repository:
    name: Repository / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspace
        run: npm ci --ignore-scripts
      - name: Verify repository contracts
        run: npm run verify:repo
      - name: Verify exact ported blobs
        run: npm run verify:port
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit

  integration:
    name: Integration skeleton
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspace
        run: npm ci --ignore-scripts
      - name: Run integration skeleton
        run: npm run test:integration

  native:
    name: Native routing baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Run native tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  security:
    name: Security foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspace
        run: npm ci --ignore-scripts
      - name: Audit production dependency surface
        run: npm run audit:prod

  packaging:
    name: Packaging foundation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked workspace
        run: npm ci --ignore-scripts
      - name: Build and validate package surface
        run: npm run package:smoke

  foundation:
    name: Foundation aggregate
    runs-on: ubuntu-latest
    needs: [repository, integration, native, security, packaging]
    if: always()
    steps:
      - name: Enforce prerequisites
        env:
          REPOSITORY_RESULT: ${{ needs.repository.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          PACKAGING_RESULT: ${{ needs.packaging.result }}
        run: |
          test "$REPOSITORY_RESULT" = success
          test "$INTEGRATION_RESULT" = success
          test "$NATIVE_RESULT" = success
          test "$SECURITY_RESULT" = success
          test "$PACKAGING_RESULT" = success
